[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eccentric-tde-observer"
version = "0.1.0"
description = "Observer mapping for analytic eccentric TDE discs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "scipy>=1.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/eccentric_tde_observer"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
